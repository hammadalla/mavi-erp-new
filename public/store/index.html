<body>

<header>
  <div class="wrap">
    <div class="brandrow">
      <div class="emblem"></div>
      <div><b>MAVI</b><span>Tailor Your Design</span></div>
      <div class="acct"><b id="hName">أهلاً بيكي</b><span id="hSub">سجّلي دخولك</span></div>
    </div>
    <div class="hero">
      <h1>تفاصيل تشبهكِ، <em>على مقاسك</em></h1>
      <p>اكتشفي موديلات MAVI، أو شاركينا تصميمكِ الخاص. نرافقكِ من اختيار القطعة حتى استلامها.</p>
      <div class="hchips"><span>تفصيل على مقاسك</span><span>متابعة طلبك</span><span>استلام أو توصيل</span></div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</div>

<div class="toast" id="toast"></div>
<nav class="bottomnav" id="bnav"></nav>
<div class="sheet" id="sheet"><div class="sheetin" id="sheetin"></div></div>

<script src="/store/custom.js"></script>
<script src="/store/reviews.js"></script>
<script>
/* ============================================================ */
const API = '/api/store';
const TOKEN_KEY = 'mavi_store_token';
let TOKEN = localStorage.getItem(TOKEN_KEY) || null;
let ME = null, CAT = [], ORDERS = [], VIEW = 'cat', OPEN = null, LOGIN_STEP = 'phone', CAT_SECTION='all';

const EGP = n => new Intl.NumberFormat('en-EG',{maximumFractionDigits:2}).format(n);
const fmtDate = d => d ? new Date(d).toLocaleDateString('ar-EG-u-nu-latn',{day:'2-digit',month:'short',year:'numeric'}) : '';
const $ = id => document.getElementById(id);
let toastTimer;
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('on'),3000); }

async function api(path, opts={}){
  const res = await fetch(API+path, {
    method: opts.method || 'GET',
    headers: {'Content-Type':'application/json', ...(TOKEN?{Authorization:'Bearer '+TOKEN}:{})},
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  let data = null; try { data = await res.json(); } catch(e){}
  if (res.status === 401 && TOKEN){ clearToken(); }
  if (!res.ok) throw Object.assign(new Error(data?.message || 'حصل خطأ'),
                                    {status:res.status, code:data?.error, data});
  return data;
}

function clearToken(){ customRows=null; ALERTS=[]; UNREAD=0; alertCustomerId=null; updatesPending=false; TOKEN=null; ME=null; localStorage.removeItem(TOKEN_KEY); renderTabs(); render(); }

/* ---------- boot ---------- */
async function boot(){
  try { const c = await api('/catalogue'); CAT = c.styles; } catch(e){ toast('مش قادرين نحمل الكتالوج'); }
  // try the token, and if there isn't one, the httpOnly cookie may still be valid —
  // that's what keeps her signed in when she reopens the app from her home screen
  try {
    const me = await api('/me');
    ME = me.profile;
  } catch(e){ if (TOKEN) clearToken(); }
  await loadReviews(); renderTabs(); render();
}

/* ---------- nav ---------- */
const TABS = [
  {k:'cat',  label:'الكتالوج', ic:'◇'},
  {k:'mine', label:'طلباتي',   ic:'▤'},
  {k:'data', label:'بياناتي',  ic:'☺'},
];
function renderTabs(){
  $('tabs').innerHTML = TABS.map(t=>`<button class="${VIEW===t.k?'on':''}" onclick="go('${t.k}')">${t.label}${t.k==='mine'&&UNREAD?`<span class="notif-badge">${UNREAD>99?'99+':UNREAD}</span>`:''}</button>`).join('');
  $('bnav').innerHTML = TABS.map(t=>`<button class="${VIEW===t.k?'on':''}" onclick="go('${t.k}')">
      <span class="ic">${t.ic}</span>${t.label}${t.k==='mine'&&UNREAD?`<span class="notif-badge">${UNREAD>99?'99+':UNREAD}</span>`:''}</button>`).join('')
    + `<button onclick="waContact()"><span class="ic">✆</span>كلمينا</button>`;
  if(ME && alertCustomerId!==ME.id){alertCustomerId=ME.id;queueMicrotask(refreshOrderUpdates)}
  if (ME){ $('hName').textContent = 'أهلاً ' + (ME.name||'').split(' ')[0]; $('hSub').textContent = ME.area || 'عميلة Mavi'; }
  else { $('hName').textContent = 'أهلاً بيكي'; $('hSub').textContent = 'سجّلي دخولك'; }
}
function go(v){ VIEW=v; if(v==='mine' && ME){loadOrders();refreshCustom();refreshOrderUpdates();} renderTabs(); render(); window.scrollTo({top:0,behavior:'smooth'}); }
function render(){
  // the login flow always belongs to the "بياناتي" tab
  // only an in-progress login flow (code / register / set-password) forces this tab;
  // guests must still land on the catalogue
  if (!ME && ['code','register','setpass'].includes(LOGIN_STEP)) VIEW = 'data';
  $('view').innerHTML = ({cat:catView, mine:mineView, data:dataView})[VIEW]();
}

function waContact(){
  const txt = encodeURIComponent('مرحباً Mavi 🤍 عندي استفسار');
  window.open('https://wa.me/201013979358?text='+txt,'_blank');
}

/* ============================================================ 1. CATALOGUE */
function catView(){

function photoCarousel(p){const imgs=p.images||[];if(!imgs.length)return '';const n=OPEN.photoIndex||0;return `<div style="position:relative;overflow:hidden;border-radius:14px;background:#f5f5f5;margin-bottom:15px"><img src="/api/catalogue/images/${Number(imgs[n])}" alt="${safeCustom(p.name)} — صورة ${n+1}" style="display:block;width:100%;height:320px;object-fit:contain">${imgs.length>1?`<div style="display:flex;align-items:center;justify-content:center;gap:16px;padding:8px"><button class="btn" onclick="slidePhoto(-1)" aria-label="الصورة السابقة">‹</button><span>${n+1} / ${imgs.length}</span><button class="btn" onclick="slidePhoto(1)" aria-label="الصورة التالية">›</button></div>`:''}</div>`}

/* ============================================================ 2. PRODUCT SHEET */
function openProduct(id){
  const p = CAT.find(x=>x.id===id); if(!p) return;
  const prev = (OPEN && OPEN.id===id) ? OPEN : null;
  OPEN = {
    id, p,
    colour: prev ? prev.colour : (p.colours[0]?.name || null),
    length: prev ? prev.length : (p.lengths[0] || null),
    size:   prev ? prev.size   : (p.sizes[1] || p.sizes[0] || null),
    qty:    prev ? prev.qty    : 1,
    deliver:prev ? prev.deliver: true,
    note:   prev ? prev.note   : '',
    fabric: prev ? prev.fabric : (p.fabrics?.[0] || 'قماش العميلة'),
    governorate:prev ? prev.governorate : '', photoIndex:prev ? prev.photoIndex : 0,
  };
  $('sheetin').innerHTML = sheetHtml();
  paintTotal();
  $('sheet').classList.add('on');
}

    <div style="font-size:11.5px;color:#c2cdea;margin-top:2px">${p.type==='stock'?'جاهز للتسليم':`التفصيل ${p.lead_days} يوم عمل`} · ${p.note||''}</div>

    <div class="fld"><label>اللون</label>
      <div class="opts">${p.colours.map(c=>`<button class="${OPEN.colour===c.name?'on':''}"

    </div>
    ${p.lengths.length?`<div class="fld"><label>الطول</label>
      <div class="opts">${p.lengths.map(l=>`<button class="${OPEN.length===l?'on':''}"
        onclick="pick('length',${l})">${l} سم</button>`).join('')}</div></div>`:''}
    ${p.sizes.length?`<div class="fld"><label>المقاس</label>

function refreshSheet(){ $('sheetin').innerHTML = sheetHtml(); paintTotal(); }
function paintTotal(){
  const el = $('otot'); if(!el) return;
  el.textContent = EGP(OPEN.p.price*OPEN.qty) + ' ج.م';
}
function pick(k,v){
  const noteEl = $('onote'); if (noteEl) OPEN.note = noteEl.value;
  const gov=$('order-governorate');if(gov)OPEN.governorate=gov.value;
  const f=$('order-fabric');if(f)OPEN.fabric=f.value;
  OPEN[k]=v; refreshSheet();
}
function closeSheet(){ $('sheet').classList.remove('on'); }
document.addEventListener('keydown', e=>{if(e.key==='Escape' && $('sheet').classList.contains('on'))closeSheet()});

function waProduct(){
  const {p} = OPEN;
  const txt = encodeURIComponent(
    `مرحباً Mavi 🤍\nعايزة أطلب: ${p.name}\nاللون: ${OPEN.colour}` +
    (OPEN.length?`\nالطول: ${OPEN.length} سم`:'') + (OPEN.size?`\nالمقاس: ${OPEN.size}`:'') +
    `\nالعدد: ${OPEN.qty}\nالاستلام: ${OPEN.deliver?'توصيل':'استلام من عندنا'}` +
    (ME?`\nالاسم: ${ME.name}\nالموبايل: ${ME.phone}`:''));
  window.open('https://wa.me/201013979358?text='+txt,'_blank');
}

async function submitOrder(){
  if(!ME){ toast('سجّلي دخولك الأول 🙏'); closeSheet(); go('data'); return; }
  const noteEl = $('onote');
  const body = {
    style_id: OPEN.id, colour: OPEN.colour, length_cm: OPEN.length,
    size: OPEN.size, qty: OPEN.qty, delivery: OPEN.deliver,
    note: noteEl ? noteEl.value.trim() : OPEN.note,
    governorate: $('order-governorate')?.value.trim() || '', fabric_choice: $('order-fabric')?.value || OPEN.fabric,
  };
  try{
    const r = await api('/orders', {method:'POST', body});
    closeSheet();
    toast('وصلنا طلبك ✓ كود المتابعة ' + r.order.code);
    go('mine');
    loadOrders();
  }catch(e){
    if (e.data?.error === 'measurements_required'){
      toast('التفصيل محتاج مقاساتك الأول');
      closeSheet(); go('data');
    } else if (e.status === 401){
      toast('سجّلي دخولك الأول'); closeSheet(); go('data');
    } else toast(e.message);
  }
}

async function loadOrders(){
  try { const r = await api('/orders'); ORDERS = r.orders; } catch(e){ ORDERS = []; }
  if (VIEW === 'mine') render();
}
let ALERTS=[], UNREAD=0, alertCustomerId=null, refreshBusy=false, updatesPending=false;
function measurementsComplete(){const m=ME?.measurements||{};return !!(ME&&ME.name&&ME.name.trim().length>=3&&ME.name.trim()!=='عميلة جديدة'&&['waist','hip','bust','length'].every(k=>Number(m[k])>=20&&Number(m[k])<=250));}
function notificationsView(){if(!ALERTS.length)return '';return `<section class="panel notif-panel"><div class="notif-head"><b>تحديثات طلباتك</b><span class="cx-status">${UNREAD?UNREAD+' جديد':'تمت القراءة'}</span></div>${ALERTS.map(n=>`<div class="notif-item ${n.read_at?'read':''}"><span class="notif-dot"></span><div>${safeCustom(n.message)}<small>${safeCustom(n.created_at)}</small></div></div>`).join('')}${UNREAD?'<button class="btn notif-mark" onclick="markNotificationsRead()">تحديد الكل كمقروء</button>':''}<p class="notif-note">تظهر تحديثات طلباتك هنا عند فتح حسابك.</p></section>`}
async function markNotificationsRead(){try{await api('/notifications/read-all',{method:'POST'});await refreshOrderUpdates(true)}catch(e){toast(e.message)}}
async function refreshOrderUpdates(force=false){
 if(!ME||refreshBusy)return;refreshBusy=true;const customerId=ME.id;
 try{const [n,o,c]=await Promise.all([api('/notifications'),api('/orders'),VIEW==='mine'?api('/custom-requests'):Promise.resolve(null)]);if(!ME||ME.id!==customerId)return;const changed=JSON.stringify(ALERTS)!==JSON.stringify(n.notifications)||UNREAD!==n.unread||JSON.stringify(ORDERS)!==JSON.stringify(o.orders)||(c&&JSON.stringify(customRows)!==JSON.stringify(c.requests));ALERTS=n.notifications;UNREAD=n.unread;ORDERS=o.orders;if(c)customRows=c.requests;renderTabs();const editing=[...document.querySelectorAll('#view input[type=file]')].some(x=>x.files.length);const focused=!!document.activeElement?.closest('#view')&&['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName);if(VIEW==='mine'&&(changed||force||updatesPending)){if(editing||focused)updatesPending=true;else{updatesPending=false;render()}}}catch(e){}finally{refreshBusy=false}
}
setInterval(()=>{if(ME && !document.hidden)refreshOrderUpdates()},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ME)refreshOrderUpdates()});

      <div style="font-size:11.5px;color:var(--muted);margin-top:2px">
        ${o.items.map(i=>`${i.colour||''}${i.length_cm?' · '+i.length_cm+' سم':''}${i.size?' · '+i.size:''} · عدد ${i.qty}`).join(' | ')}
      </div>
      <div style="font-size:11.5px;color:var(--muted);margin-top:2px">
        ${EGP(o.total)} ج.م ${o.delivery_requested&&!o.shipping_quoted?'(قبل الشحن؛ يُحدد لاحقًا)':''} · ${o.delivery_requested?(o.shipping_quoted?'توصيل '+EGP(o.delivery_fee)+' ج.م':'توصيل — التكلفة قيد التحديد'):'استلام من عندنا'}${o.promise_date?` · وعد التسليم ${fmtDate(o.promise_date)}`:''}

    </div>`;
  }

  if (LOGIN_STEP === 'setpass'){
    return `<h2 class="sec">اختاري باسورد <span class="ln"></span></h2>
    <div class="panel">
      <div style="font-size:12.5px;color:#44537a;margin-bottom:11px">
        عشان تدخلي بسرعة المرة الجاية من غير كود — اختاري باسورد ليكي.</div>
      <div class="fld"><label>الباسورد (٦ حروف أو أرقام على الأقل)</label>
        <input id="spass" type="password" placeholder="••••••"></div>
      <button class="btn primary wide" onclick="setPassword()">حفظ ودخول</button>
      <button class="btn wide" style="margin-top:8px" onclick="skipSetPassword()">مش دلوقتي</button>
    </div>`;
  }

  if (LOGIN_STEP === 'register'){
    return `<h2 class="sec">حساب جديد <span class="ln"></span></h2>
    <div class="panel">
      <div style="font-size:12.5px;color:#44537a;margin-bottom:11px">
        أول مرة معانا؟ اكتبي اسمك ورقمك واختاري باسورد — دقيقة واحدة.</div>
      <div class="fld"><label>الاسم</label>
        <input id="rname" placeholder="اسمك"></div>
      <div class="fld"><label>رقم الموبايل</label>
        <input id="rphone" type="tel" inputmode="numeric" placeholder="01xxxxxxxxx" style="direction:ltr;text-align:right"></div>
      <div class="fld"><label>الباسورد (٦ حروف أو أرقام على الأقل)</label>
        <input id="rpass" type="password" placeholder="••••••"></div>
      <button class="btn primary wide" onclick="register()">إنشاء الحساب</button>
      <button class="btn wide" style="margin-top:8px" onclick="LOGIN_STEP='phone';render()">عندي حساب بالفعل</button>
    </div>`;
  }

  return `<h2 class="sec">دخول <span class="ln"></span></h2>
  <div class="panel">
    <div class="fld"><label>رقم الموبايل</label>
      <input id="phone" type="tel" inputmode="numeric" placeholder="01xxxxxxxxx" style="direction:ltr;text-align:right"></div>
    <div class="fld"><label>الباسورد</label>
      <input id="pass" type="password" placeholder="••••••" onkeydown="if(event.key==='Enter')login()"></div>
    <button class="btn primary wide" onclick="login()">دخول</button>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn" style="flex:1" onclick="LOGIN_STEP='register';render()">حساب جديد</button>
      <button class="btn" style="flex:1" onclick="forgotPassword()">نسيت الپاسورد</button>
    </div>
    <div class="lockrow" style="justify-content:center">🔒 رقمك بيستخدم للدخول والتواصل عن طلباتك بس.</div>
  </div>`;
}

async function login(){
  const phone = ($('phone').value||'').replace(/\s/g,'');
  const password = $('pass').value || '';
  if(!/^01[0-9]{9}$/.test(phone)){ toast('رقم الموبايل لازم يبدأ بـ 01 ويكون 11 رقم'); return; }
  if(password.length<1){ toast('اكتبي الباسورد'); return; }
  try{
    const r = await api('/auth/login', {method:'POST', body:{phone, password}});
    TOKEN = r.token; localStorage.setItem(TOKEN_KEY, TOKEN);
    ME = r.profile; LOGIN_STEP='phone'; renderTabs(); render();
    toast('أهلاً بيكي 🤍');
  }catch(e){
    if (e.code === 'needs_password'){
      toast(e.message);
      window.__phone = phone;
      forgotPassword();
      return;
    }
    toast(e.message);
  }
}

async function register(){
  const name = ($('rname').value||'').trim();
  const phone = ($('rphone').value||'').replace(/\s/g,'');
  const password = $('rpass').value || '';
  if(name.length<2){ toast('اكتبي اسمك'); return; }
  if(!/^01[0-9]{9}$/.test(phone)){ toast('رقم الموبايل لازم يبدأ بـ 01 ويكون 11 رقم'); return; }
  if(password.length<6){ toast('الباسورد لازم ٦ حروف على الأقل'); return; }
  try{
    const r = await api('/auth/register', {method:'POST', body:{name, phone, password}});
    TOKEN = r.token; localStorage.setItem(TOKEN_KEY, TOKEN);
    ME = r.profile; LOGIN_STEP='phone'; renderTabs(); render();
    toast('حسابك اتعمل ✓');
  }catch(e){ toast(e.message); }
}

async function setPassword(){
  const password = $('spass').value || '';
  if (password.length<6){ toast('الباسورد لازم ٦ حروف على الأقل'); return; }
  try{
    const r = await api('/auth/set-password', {method:'POST', body:{password}});
    ME = r.profile; LOGIN_STEP='phone'; renderTabs(); render();
    toast('تم ✓ المرة الجاية ادخلي بالباسورد');
  }catch(e){ toast(e.message); }
}
function skipSetPassword(){
  LOGIN_STEP='phone'; renderTabs(); render();
}

async function changeCustomerPassword(){try{await api('/auth/change-password',{method:'POST',body:{current:$('current-password').value,next:$('new-password').value}});$('current-password').value='';$('new-password').value='';toast('تم تغيير كلمة المرور');}catch(e){toast(e.message)}}
async function forgotPassword(){
  const phone = ($('phone').value||'').replace(/\s/g,'');
  const msg = 'مرحباً، نسيت كلمة مرور حسابي في MAVI وأحتاج المساعدة في استعادته.' + (/^01[0-9]{9}$/.test(phone) ? ' رقم حسابي: '+phone : '');
  window.open('https://wa.me/201013979358?text='+encodeURIComponent(msg),'_blank','noopener,noreferrer');
  toast('تواصلي معنا لمساعدتك في استعادة حسابك بعد التأكد من هويتك');
}

function otpNext(el,i){
  el.value = el.value.replace(/\D/g,'').slice(0,1);
  if (el.value && i<5) $('o'+(i+1)).focus();
  if (i===5 && el.value) verifyCode();
}
function otpBack(e,i){
  if (e.key==='Backspace' && !e.target.value && i>0) $('o'+(i-1)).focus();
}
async function verifyCode(){
  const code = [0,1,2,3,4,5].map(i=>($('o'+i)?.value||'')).join('');
  if (code.length<6){ toast('اكتبي الكود كامل'); return; }
  try{
    const r = await api('/auth/verify', {method:'POST', body:{phone:window.__phone, code}});
    TOKEN = r.token; localStorage.setItem(TOKEN_KEY, TOKEN);
    ME = r.profile; window.__manual=false;
    if (!r.profile.has_password){ LOGIN_STEP='setpass'; render(); return; }   // ask once
    LOGIN_STEP='phone'; renderTabs(); render();
    toast('أهلاً بيكي 🤍');
  }catch(e){ toast(e.message); }
}

async function saveProfile(){
  try{
    const r = await api('/me', {method:'PATCH', body:{name:$('pname').value.trim(), area:$('parea').value.trim()}});
    ME = r.profile; renderTabs(); render(); toast('تم الحفظ ✓');
  }catch(e){ toast(e.message); }
}
async function saveMeasurements(){
  const body = {};
  [['waist'],['hip'],['bust'],['length'],['sleeve'],['arm']].forEach(([k])=>{
    const v = $('m_'+k).value; if (v !== '') body[k] = Number(v);
  });
  try{
    await api('/me/measurements', {method:'PUT', body});
    const me = await api('/me'); ME = me.profile; render(); toast('المقاسات اتحفظت ✓');
  }catch(e){ toast(e.message); }
}
async function logout(){
  try{ await api('/auth/logout',{method:'POST'}); }catch(e){}
  clearToken(); ORDERS=[]; toast('خرجتي');
}

/* ---------- boot ---------- */
$('sheet').addEventListener('click', e=>{ if(e.target.id==='sheet') closeSheet(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSheet(); });
boot();
